# Shared by backup and health service templates. See docs/guides/systemd.md.
[Service]
# The unprivileged service and its children need no Linux capabilities.
CapabilityBoundingSet=
# Prevent changing execution domains, gaining real-time scheduling, or creating
# set-user-ID/set-group-ID files.
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
# Keep the service from changing kernel and cgroup configuration or loading
# kernel modules. These do not restrict configured backup paths.
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
